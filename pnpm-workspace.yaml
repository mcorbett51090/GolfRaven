packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# P2 stage 2 (apps/site): sharp is a pinned dependency of og-card.ts
# (build plan §5.1 "og-card.ts ... Adapt | same" — satori + sharp, same
# as southern-wine-country @ 572ff7e). pnpm 10 blocks a dependency's
# native postinstall (sharp's libvips prebuild fetch) unless explicitly
# allow-listed here; without this, `sharp` has no binary to load at
# runtime.
onlyBuiltDependencies:
  - sharp
