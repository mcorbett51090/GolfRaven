packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# P2 stage 2 (apps/site): `sharp` is a pinned dependency of og-card.ts
# (build plan §5.1 "og-card.ts ... Adapt | same" — satori + sharp, same as
# southern-wine-country @ 572ff7e) AND of gen-app-icons.mjs. pnpm 10 blocks
# a dependency's native postinstall (sharp's own libvips prebuild fetch)
# unless explicitly allow-listed here; without this line, `pnpm install`
# reports "Ignored build scripts: sharp" and `sharp` has no binary to load
# at runtime (confirmed this session: the OG-card/icon scripts throw on
# import until this is present).
#
# `@playwright/test` (added for the B2 runtime-CSP e2e test,
# apps/site/test/e2e/) needed NO entry here — confirmed this session, a
# plain `pnpm install` reports no "Ignored build scripts" for it. It reads
# its Chromium binary from `PLAYWRIGHT_BROWSERS_PATH` (this environment
# pre-populates `/opt/pw-browsers`, pinned to the exact revision
# `@playwright/test@1.56.1` expects) rather than running its own
# postinstall download.
onlyBuiltDependencies:
  - sharp

# P4.1 (apps/mobile): expo-router 57.0.22 depends on react-native-drawer-layout,
# which declares react-native-reanimated and react-native-gesture-handler as
# NON-optional peers. With `autoInstallPeers: true` (this repo's setting) pnpm
# therefore installs reanimated 4.7.1, gesture-handler 3.3.0 and (via
# reanimated) react-native-worklets 0.13.0 — three native modules that this
# app never imports, at versions outside Expo SDK 57's certified set
# (gesture-handler ~2.32.0, reanimated 4.5.1, worklets 0.10.1), and Expo's
# autolinking then compiles all three into the binary (observed with
# `expo-modules-autolinking react-native-config`, see apps/mobile/SPIKE.md).
# The drawer layout is only used by expo-router's Drawer navigator, which the
# app does not use, so the peers are marked optional here.
packageExtensions:
  react-native-drawer-layout:
    peerDependenciesMeta:
      react-native-reanimated:
        optional: true
      react-native-gesture-handler:
        optional: true
