name: golfraven CI

# POST-EXTRACTION COPY. This is what the live workflow becomes once
# golfraven/ is split out to its own repo root (git subtree split
# --prefix=golfraven) — same jobs as the currently-live
# /.github/workflows/golfraven-ci.yml at the RavenGolf repo root, minus
# the golfraven/ working-directory scoping that file needs while
# golfraven/ is still a subdirectory. This file is not live until that
# split happens (a workflow only runs from .github/workflows/ at whatever
# is the repo root at the time). Keeping it in sync now means extraction
# needs no CI edit — see the root README.md "Staging note".

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: install / typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install gitleaks (checksum-pinned, no third-party Action)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          chmod +x /tmp/gitleaks-bin/gitleaks
          echo "/tmp/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan (no service-role, Stripe or OAuth secret in any bundle or commit)
        run: |
          set -euo pipefail
          gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v --exit-code 1
