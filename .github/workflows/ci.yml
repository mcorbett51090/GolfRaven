name: golfraven CI

# Live CI for the golfraven repo. (Originally written as the post-extraction copy while the
# monorepo was staged under golfraven/ in RavenGolf; it became live when the repo was split out.)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # S5: telemetry stays off in CI, same as any other non-interactive build.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: install / typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        # B3: apps/site's fail-closed demo guard refuses to build with an
        # empty data/ unless GOLFRAVEN_DEMO=1 is set explicitly — data/
        # carries no real facility/trail content yet (data/README.md), so
        # CI opts into the synthetic demo dataset on purpose, scoped to
        # just this step (`pnpm -r build` also builds every OTHER package,
        # none of which reads this var). Never set for a real production
        # deploy — see apps/site/src/lib/derive.ts's loadSiteCatalog,
        # which also refuses GOLFRAVEN_DEMO=1 outright when
        # GOLFRAVEN_ENV=production.
        run: pnpm -r build
        env:
          GOLFRAVEN_DEMO: "1"

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        # Same scoping as the Build step above — apps/site's own test
        # suite forces GOLFRAVEN_DEMO=1 itself (test/global-setup.mjs), but
        # setting it here too keeps `pnpm -r test` runnable exactly like a
        # local `GOLFRAVEN_DEMO=1 pnpm -r test` invocation.
        #
        # apps/site's `test` script also runs `scripts/run-e2e.mjs` (the
        # B2 Playwright runtime-CSP check) after vitest. This runner has NO
        # `playwright install` step anywhere in this workflow — confirmed
        # this session that neither `playwright-core` nor `playwright` has
        # a postinstall browser download at all (it's an explicit, separate
        # `npx playwright install` step nobody runs here), so a GitHub
        # Actions `ubuntu-latest` runner has no browser for it to find.
        # `run-e2e.mjs` probes for a launchable Chromium FIRST and skips
        # itself (exit 0, with a printed reason) when none is found, rather
        # than failing this step — so CI stays green with the check simply
        # not exercised here, exactly the "gate it... and say so" shape the
        # gate review asked for. It is exercised where a Chromium binary
        # IS already provisioned (this repo's own agent sandbox,
        # `/opt/pw-browsers`). `scripts/lighthouse-audit.mjs` (the real,
        # non-heuristic half of AT(2)) is the same story and is
        # NOT wired in here for the same reason — AT(2)'s CI-enforced half
        # stays the static heuristic (`verify-a11y-budget.mjs`, part of
        # `pnpm -r build`) until someone confirms Chromium is actually
        # available on this workflow's runner and wires it in deliberately.
        run: pnpm -r test
        env:
          GOLFRAVEN_DEMO: "1"

      - name: verify-contract (contract/catalog.schema.json must match packages/catalog's Zod schema)
        run: node tools/catalog/dist/verify-contract.js

  gitleaks:
    name: gitleaks scan (git history + working tree/bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (so bundles under dist/ exist to scan — gate review S13)
        # Scoped the same way as the verify job's Build step — see its comment.
        run: pnpm -r build
        env:
          GOLFRAVEN_DEMO: "1"

      - name: Install gitleaks (checksum-pinned, no third-party Action)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          chmod +x /tmp/gitleaks-bin/gitleaks
          echo "/tmp/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan git history (no service-role, Stripe or OAuth secret in any commit)
        run: |
          set -euo pipefail
          # This is now its own repo root (post-extraction), so a full
          # history scan is meaningful here in a way it isn't for the
          # currently-live root workflow (gate review S13) — fetch-depth: 0
          # above gets the full history to scan.
          gitleaks git . --config .gitleaks.toml --redact -v --exit-code 1

      - name: Scan working tree + dist/ bundles (no service-role, Stripe or OAuth secret in any bundle)
        run: |
          set -euo pipefail
          # `gitleaks dir` (not the deprecated `detect --no-git` alias),
          # run AFTER the build step so dist/ bundles are included — the
          # git-history scan above never sees build output that isn't
          # committed (gate review S13).
          gitleaks dir . --config .gitleaks.toml --redact -v --exit-code 1
