name: golfraven CI

# Live CI for the golfraven repo. (Originally written as the post-extraction copy while the
# monorepo was staged under golfraven/ in RavenGolf; it became live when the repo was split out.)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same PR supersedes a still-running run; pushes to main
# are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # S5: telemetry stays off in CI, same as any other non-interactive build.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: install / typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        # B3: apps/site's fail-closed demo guard refuses to build with an
        # empty data/ unless GOLFRAVEN_DEMO=1 is set explicitly — data/
        # carries no real facility/trail content yet (data/README.md), so
        # CI opts into the synthetic demo dataset on purpose, scoped to
        # just this step (`pnpm -r build` also builds every OTHER package,
        # none of which reads this var). Never set for a real production
        # deploy — see apps/site/src/lib/derive.ts's loadSiteCatalog,
        # which also refuses GOLFRAVEN_DEMO=1 outright when
        # GOLFRAVEN_ENV=production.
        run: pnpm -r build
        env:
          GOLFRAVEN_DEMO: "1"

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Install Playwright Chromium (pinned to @playwright/test's own version)
        # Re-gate correction (superseding the comment the Test step used to
        # carry): apps/site's `test` script also runs `scripts/run-e2e.mjs`
        # (the B2 Playwright runtime-CSP check, plus the Pagefind/CSP
        # search check) after vitest. CI now installs the SAME pinned
        # Chromium revision `@playwright/test@1.56.1` declares — no
        # hard-coded revision number here, `playwright install` resolves
        # whatever revision that package version pins, kept in lockstep by
        # `pnpm-lock.yaml`. `--with-deps` also installs the OS-level shared
        # libraries `ubuntu-latest` doesn't ship by default.
        #
        # `run-e2e.mjs` still probes for a launchable browser first, but
        # now under `CI=true` (set automatically by GitHub Actions on every
        # runner — never has to be set explicitly here) a launch FAILURE is
        # a hard failure, not a skip: this step is what makes that
        # distinction meaningful, since a launch failure in CI is now a
        # real regression (a broken install / a pin drift), never an
        # expected environment gap. `scripts/lighthouse-audit.mjs` (the
        # real, non-heuristic half of AT(2)) is a separate story and stays
        # NOT wired in here — AT(2)'s CI-enforced half stays the static
        # heuristic (`verify-a11y-budget.mjs`, part of `pnpm -r build`).
        run: pnpm --filter @golfraven/site exec playwright install --with-deps chromium

      - name: Test
        # Same scoping as the Build step above — apps/site's own test
        # suite forces GOLFRAVEN_DEMO=1 itself (test/global-setup.mjs), but
        # setting it here too keeps `pnpm -r test` runnable exactly like a
        # local `GOLFRAVEN_DEMO=1 pnpm -r test` invocation.
        run: pnpm -r test
        env:
          GOLFRAVEN_DEMO: "1"

      - name: verify-contract (contract/catalog.schema.json must match packages/catalog's Zod schema)
        run: node tools/catalog/dist/verify-contract.js

  db-tests:
    # Distinct job id/name from `verify` on purpose — task instruction
    # ("keep the job id and name distinct, and don't rename the existing
    # required job") and this repo's own convention (AGENTS.md "Required
    # status checks"): a NEW job is additive, never a reason to touch an
    # existing required check's identity.
    name: player-plane DB (migrations + pgTAP authorization matrix)
    runs-on: ubuntu-latest
    # Bumped from 15 (S1, gate round 3): the harness now runs twice —
    # HARNESS_MODE=superuser and HARNESS_MODE=restricted, each a full
    # initdb/migrate/seed/pgTAP/teardown cycle — so the old single-run
    # budget is too tight.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install PostgreSQL 17 + PostGIS 3 + pgTAP (PGDG apt, key-checked)
        # Postgres 17, PostGIS 3, pgTAP (build plan §10 P3,
        # docs/golf-trails/02-build-plan.md:2758). No Docker, no Supabase
        # CLI: supabase/tests/shim.sql is the local stand-in in both places.
        #
        # ⛔ FIX (should-fix, post-P3a re-gate): switched from PostgreSQL 16
        # to 17 — `GRANT ... WITH INHERIT/SET` (0016_private_definer.sql,
        # H2's fix) is PG16+ syntax, and the pinned major
        # (supabase/config.toml `[db] major_version = 17`) is what a real
        # `supabase db push`/`supabase start` targets: Supabase Cloud has
        # defaulted new projects to PostgreSQL 17 for some time before
        # 2026-09-24, and self-hosted Supabase moved to PG17-by-default on
        # 2026-06-17 [docs-verified 2026-09-24 via WebSearch — see
        # config.toml's own note on why this is corroborated rather than
        # cited to supabase.com directly]. Verified locally this session
        # against PostgreSQL 17.11 (PGDG), both HARNESS_MODE=superuser and
        # HARNESS_MODE=restricted, full green — this step mirrors that
        # exact install.
        #
        # S4 (gate round 2), still the reason this installs from PGDG
        # directly rather than pinning an exact `pkg=version`: the runner
        # image's own preinstalled PostgreSQL build changes over time and
        # an exact version pin fails outright the moment it's superseded
        # ("Package postgresql-16 is not available" on the first CI run of
        # that gate round). PGDG prunes superseded builds from its pool,
        # so versions stay pinned to the MAJOR line (PostgreSQL 17,
        # PostGIS 3) and the exact installed builds are printed below for
        # the record, rather than pinned exactly.
        run: |
          set -euo pipefail
          PGDG_FPR=B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          got=$(gpg --show-keys --with-colons /tmp/pgdg.asc | awk -F: '/^fpr:/ {print $10; exit}')
          if [ "$got" != "$PGDG_FPR" ]; then
            echo "PGDG key fingerprint mismatch: $got" >&2
            exit 1
          fi
          gpg --dearmor < /tmp/pgdg.asc | sudo tee /usr/share/keyrings/pgdg.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-17 \
            postgresql-17-postgis-3 \
            postgresql-17-postgis-3-scripts \
            postgresql-17-pgtap \
            libtap-parser-sourcehandler-pgtap-perl
          dpkg-query -W -f='${Package} ${Version}\n' \
            postgresql-17 postgresql-17-postgis-3 postgresql-17-pgtap libtap-parser-sourcehandler-pgtap-perl

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Deno 2.5.2 (checksum-pinned)
        # ⛔ MOVED (P3c gate round 2, item 0 — required first): "the CI
        # blind spot" — every HIGH/MEDIUM item that gate round found was
        # discoverable ONLY by running the REAL privileged.ts (and the
        # handlers built on it) under Deno against a real Postgres
        # cluster, and nothing in this job used to do that (pgTAP
        # exercises raw SQL directly; vitest runs against an in-memory
        # FAKE Repo). Deno used to be installed near the END of this job,
        # after both tools/db/test.sh runs already finished — moved here,
        # BEFORE them, so it is on PATH when tools/db/test.sh calls
        # tools/db/test-deno-integration.sh (supabase/tests/integration/)
        # against each harness's own live cluster, in EITHER
        # HARNESS_MODE. Exported to $GITHUB_PATH so both test.sh
        # invocations below (and this job's own later `deno check` step)
        # find it as plain `deno`, no separate re-install needed.
        run: |
          set -euo pipefail
          DENO_VERSION="2.5.2"
          DENO_SHA256="520fd4bc2d18b50b6ac2ea8b7d0f7f6a35588e412754a081e8c6afd4b15264c4"
          curl -fsSL -o /tmp/deno.zip \
            "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  /tmp/deno.zip" | sha256sum -c -
          mkdir -p /tmp/deno-bin
          unzip -q -o /tmp/deno.zip -d /tmp/deno-bin
          chmod +x /tmp/deno-bin/deno
          echo "/tmp/deno-bin" >> "$GITHUB_PATH"

      - name: Build @golfraven/service-role-lint
        # tools/db/test.sh's last step runs this package's built CLI (B5)
        # over supabase/functions — build it before the harness needs it.
        # Scoped to just this package (not the whole-repo `pnpm -r build`
        # the `verify` job runs) since nothing else in this job needs it.
        run: pnpm --filter @golfraven/service-role-lint build

      - name: Build @golfraven/rules and its dependencies
        # P3c: supabase/functions/_shared/scoring/vendor/ is a vendored
        # copy of packages/rules/dist (+ the packages/catalog/dist slice
        # it needs) — generate-bundle.sh's own freshness check
        # (supabase/tests/unit/rules-vendor-freshness.test.ts, run below)
        # regenerates from these dist/ builds and diffs, so they must
        # exist and be current. `...` (pnpm filter syntax) pulls in
        # @golfraven/rules' own workspace dependencies (@golfraven/
        # catalog, @golfraven/matching) in the right build order.
        run: pnpm --filter "@golfraven/rules..." build

      - name: Run tools/db/test.sh (HARNESS_MODE=superuser)
        # The harness owns its own throwaway cluster end to end (initdb,
        # start, shim, migrations, seed fixtures, pgTAP matrix, B4 replay/
        # concurrency check, the P3c gate round 2 Deno integration suite
        # (item 0), B2 function-inventory check, B5 service-role lint,
        # teardown) — see its header comment for the exact sequence.
        # Non-zero exit here fails the job; no `paths:` filter on this
        # workflow's trigger (AGENTS.md "Required status checks — never
        # add paths: to a required workflow"), so this job always
        # evaluates once it is made required, same as `verify` and
        # `gitleaks`. This run connects as the cluster bootstrap role (a
        # true Postgres superuser) — the harness's original behaviour,
        # unchanged; HARNESS_MODE defaults to `superuser` when unset. Deno
        # is already on PATH (installed above) for the harness's own
        # tools/db/test-deno-integration.sh step.
        run: bash tools/db/test.sh
        env:
          HARNESS_MODE: superuser

      - name: Run tools/db/test.sh (HARNESS_MODE=restricted)
        # S1 close-out (gate round 3): "add a harness mode where tests run
        # as a NOSUPERUSER NOBYPASSRLS owner/test role ... An RLS test
        # that only passes under superuser is a false pass." This second,
        # independent run of the SAME harness against a FRESH throwaway
        # cluster (tools/db/test.sh tears its own cluster down on exit, so
        # the two runs never share state) connects migrations/fixtures/
        # pgTAP/the Deno integration suite as `migration_owner` instead —
        # LOGIN, CREATEDB, CREATEROLE, explicitly NOSUPERUSER NOBYPASSRLS
        # (supabase/tests/shim.sql) — proving "Conditions on the
        # BYPASSRLS design"'s own `SET LOCAL ROLE service_role`
        # activation works from a connecting role that is NOT already
        # service_role, in BOTH harness shapes. Extension installation
        # stays on the step above (bootstrap-as-superuser in either mode,
        # per the harness's own header comment).
        run: bash tools/db/test.sh
        env:
          HARNESS_MODE: restricted

      - name: Run supabase/tests/unit (vitest — P3c pure/DI'd handler modules)
        # Task instruction: "put handler logic in pure, dependency-injected
        # modules unit-testable without a live Supabase" — run under
        # vitest against an in-memory FAKE Repo (supabase/tests/unit/
        # fake-repo.ts), complementary to (not a replacement for) the
        # Deno integration suite above, which runs the SAME handler
        # modules against the REAL privileged.ts and a real Postgres
        # cluster (P3c gate round 2, item 0's own point: the fake Repo
        # alone missed real bugs a real DB catches). Deno IS installed in
        # this job (moved earlier, above) — vitest runs regardless, since
        # it is a cross-runtime signal in its own right, not merely a
        # Deno-unavailable fallback (see supabase/tests/vitest.config.ts's
        # own header for why these tests need a small resolve-alias table
        # at all: supabase/ is deliberately not a registered pnpm
        # workspace package, so this runs FROM @golfraven/rules, which
        # already depends on zod/@noble/hashes/tz-lookup at the exact
        # versions supabase/functions/deno.json pins, rather than as its
        # own package).
        run: pnpm --filter @golfraven/rules exec vitest run --config ../../supabase/tests/vitest.config.ts

      - name: deno check (frozen lockfile)
        # Best-effort second signal alongside vitest AND the Deno
        # integration suite above: `deno check` type-checks every Edge
        # Function entrypoint and shared module against Deno's OWN
        # resolution (deno.json's import map, confirmed this session to
        # require `--config` explicitly — see docs/security/
        # p3-money-path-requirements.md's pre-existing "pin --config at
        # deploy time" unverified flag, which this confirms is a real,
        # live requirement, not merely theoretical).
        # ⛔ FIX (P3c gate round 2, should-fix "supply chain"): runs
        # against the committed supabase/tests/deno.lock with --frozen
        # now, instead of --no-lock — so transitive drift (e.g. a
        # dependency's own dependency quietly moving underneath a pinned
        # top-level URL) fails loudly here instead of resolving silently.
        # Deno itself is already installed + on PATH (moved earlier in
        # this job, so the Deno integration suite step above can use it
        # too) — this step only runs the check.
        run: |
          set -euo pipefail
          deno check --config supabase/functions/deno.json --lock=supabase/tests/deno.lock --frozen \
            supabase/functions/evidence/index.ts \
            supabase/functions/evidence-batch/index.ts \
            supabase/functions/checkin-challenge/index.ts \
            supabase/functions/checkin-token/index.ts \
            supabase/functions/_shared/privileged.ts

      - name: deno cache --frozen (proves the pinned hashes, tamper-evident)
        # P3c gate round 3, should-fix: "deno check --frozen doesn't
        # verify JS module hashes. Add a CI step that proves the pin...
        # and confirm a tampered hash fails it in /tmp. Don't overstate it
        # in the step name."
        #
        # ⛔ CORRECTED (P3c gate round 4): this step's own comment
        # previously claimed "`deno check --frozen` ALSO failed... in
        # every combination tested," based on tampering ONE file
        # (`deno.land/x/postgresjs@v3.4.5/mod.js`) — a plain `.js` module
        # that is ALSO its own type source, so `deno check` happens to
        # need its real bytes for type info and therefore re-verifies
        # them. That claim did not generalize and was wrong: the P3c gate
        # round 4 reviewer reproduced that `deno check --frozen` does
        # NOT catch a tampered hash for an esm.sh `.mjs` module reached
        # only through a SEPARATE `.d.ts` type declaration (`ws.mjs`,
        # `supabase-js.mjs`) — `deno check` only needs the `.d.ts` for
        # type-checking, never touches the `.mjs` runtime bytes at all,
        # so a tampered `.mjs` hash is silently invisible to it. This
        # session independently reproduced the SAME result: a
        # byte-flipped hash for `@supabase/supabase-js@2.45.4/denonext/
        # supabase-js.mjs` left `deno check --frozen` at exit 0 (no
        # error at all) while `deno cache --frozen` correctly failed at
        # exit 10. So the step above (`deno check`) is NOT sufficient
        # proof on its own, for every class of pinned dependency this
        # repo has — THIS step is the one actually doing the pin-proof
        # work, not a secondary belt-and-suspenders addition to the one
        # above. The next step below runs the SAME kind of tamper test
        # this comment describes, every CI invocation, rather than
        # resting on a comment's one-off manual claim (which is exactly
        # how the ORIGINAL wrong claim here went unnoticed for a round).
        # Step name says "hashes," never "supply chain" or "pinned
        # versions are safe" — this proves byte-for-byte integrity
        # against the LOCKFILE's own recorded hash, nothing about whether
        # those pinned versions/hashes are themselves trustworthy content
        # (that's a separate, human dependency-review concern, same as
        # every other pinned import in this repo).
        run: |
          set -euo pipefail
          deno cache --config supabase/functions/deno.json --lock=supabase/tests/deno.lock --frozen \
            supabase/functions/evidence/index.ts \
            supabase/functions/evidence-batch/index.ts \
            supabase/functions/checkin-challenge/index.ts \
            supabase/functions/checkin-token/index.ts \
            supabase/functions/_shared/privileged.ts

      - name: deno cache --frozen tamper test (proves the pin-proof step itself catches a real tamper)
        # P3c gate round 4: "Add a real tamper test to CI: copy the lock
        # to a temp dir, flip one byte in one JS module entry (e.g. the
        # ws or supabase-js .mjs), and assert deno cache --frozen exits
        # non-zero." This is that test, run every invocation — not a
        # comment asserting a manual one-off (see the previous step's
        # own corrected comment for why a stale manual claim is
        # dangerous here specifically). Targets the exact class of entry
        # shown to be invisible to `deno check --frozen` (an esm.sh
        # `.mjs` reached only via its own separate `.d.ts`), so this
        # proves the thing that actually needs proving, not merely
        # re-proving what the `postgresjs` file already showed in the
        # step above. A PASSING (exit 0) `deno cache --frozen` against
        # the tampered copy would mean the pin-proof mechanism ITSELF is
        # broken — this step fails the build in that case, distinctly
        # from an ordinary tamper detection.
        run: |
          set -euo pipefail
          export TAMPER_DIR="$(mktemp -d)"
          trap 'rm -rf "$TAMPER_DIR"' EXIT
          # Deliberately every line at the SAME indentation (no nested
          # Python block) — a YAML block scalar dedents this whole `run:`
          # block by its own uniform base indentation before bash ever
          # sees it, so an indented `with`/`if` body here would land at
          # an arbitrary, easy-to-get-wrong column once YAML is done with
          # it. One-line compound statements sidestep that entirely.
          python3 - <<'PY'
          import json, os, sys
          f = open("supabase/tests/deno.lock"); data = json.load(f); f.close()
          remote = data["remote"]
          # If this specific pin ever moves/changes, update this target
          # alongside it — same discipline as every other pinned
          # reference in this repo (deno.json's import map,
          # pinned-import-targets.json).
          target = "https://esm.sh/@supabase/supabase-js@2.45.4/denonext/supabase-js.mjs"
          if target not in remote: sys.exit(f"tamper test setup: {target!r} not found in supabase/tests/deno.lock -- the pin moved; update this script's own target to match")
          orig_hash = remote[target]
          remote[target] = ("0" if orig_hash[0] != "0" else "1") + orig_hash[1:]
          out = open(os.path.join(os.environ["TAMPER_DIR"], "tampered.lock"), "w"); json.dump(data, out); out.close()
          PY
          set +e
          deno cache --config supabase/functions/deno.json --lock="$TAMPER_DIR/tampered.lock" --frozen \
            supabase/functions/evidence/index.ts \
            supabase/functions/evidence-batch/index.ts \
            supabase/functions/checkin-challenge/index.ts \
            supabase/functions/checkin-token/index.ts \
            supabase/functions/_shared/privileged.ts
          TAMPER_EXIT=$?
          set -e
          if [ "$TAMPER_EXIT" -eq 0 ]; then
            echo "FAILED: 'deno cache --frozen' exited 0 against a lockfile with a deliberately tampered esm.sh .mjs hash -- the pin-proof step is not actually verifying integrity for this class of dependency." >&2
            exit 1
          fi
          echo "deno cache --frozen tamper test: PASS (tampered hash correctly rejected, deno exit code $TAMPER_EXIT)"

  gitleaks:
    name: gitleaks scan (git history + working tree/bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (so bundles under dist/ exist to scan — gate review S13)
        # Scoped the same way as the verify job's Build step — see its comment.
        run: pnpm -r build
        env:
          GOLFRAVEN_DEMO: "1"

      - name: Install gitleaks (checksum-pinned, no third-party Action)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          chmod +x /tmp/gitleaks-bin/gitleaks
          echo "/tmp/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan git history (no service-role, Stripe or OAuth secret in any commit)
        run: |
          set -euo pipefail
          # This is now its own repo root (post-extraction), so a full
          # history scan is meaningful here in a way it isn't for the
          # currently-live root workflow (gate review S13) — fetch-depth: 0
          # above gets the full history to scan.
          gitleaks git . --config .gitleaks.toml --redact -v --exit-code 1

      - name: Scan working tree + dist/ bundles (no service-role, Stripe or OAuth secret in any bundle)
        run: |
          set -euo pipefail
          # `gitleaks dir` (not the deprecated `detect --no-git` alias),
          # run AFTER the build step so dist/ bundles are included — the
          # git-history scan above never sees build output that isn't
          # committed (gate review S13).
          gitleaks dir . --config .gitleaks.toml --redact -v --exit-code 1
