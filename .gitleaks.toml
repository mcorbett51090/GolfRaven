title = "golfraven gitleaks config"

# Extend gitleaks' built-in default ruleset rather than redefining rules
# here. No project-specific rules are added and no path/regex is
# allowlisted — every finding gitleaks' default rules produce is a real
# finding that must be fixed or, if it is a genuine false positive, added
# to the allowlist below with a comment explaining why (build plan §15:
# "Bundle secret scan + gitleaks — no service-role, Stripe or OAuth secret
# in any bundle or commit").
[extend]
useDefault = true

# Deliberately no [allowlist] table: gitleaks 8.30.1 rejects an
# [[allowlists]]/[allowlist] table with no regexes/paths/commits set
# ("Failed to load config ... [[allowlists]] must contain at least one
# check"). Add an [allowlist] table back only when there is a real entry
# to put in it, with a comment naming the exact false positive it covers.

# 2026-09-24 — money-path pgTAP test. Lines that name the Vault test secrets
# ('pseudonym_key_1' / '_2' / '_3', later renamed to 'pseudonym_hmac_v1' /
# '_v2' / '_v3') next to fixed fake UUIDs trip the default generic-api-key
# rule on the word "key"/"hmac". No secret value is on most of those lines
# (the only test secret VALUES are the obviously fake 'shim-test-only-…'
# literals in supabase/tests/shim.sql).
#
# ⛔ FIX (post-P3a re-gate): the PRIOR regex here, `pseudonym_(key|hmac)_
# v?[0-9]`, suppressed a finding on ANY line containing that substring,
# with no requirement that the line also be one of THESE specific test
# rows — a real secret hidden in a variable literally named
# `pseudonym_hmac_v1_api_key` would have been silently allowlisted too.
# Anchored instead to the FIXED fake UUID prefix these exact fixture rows
# use (`a0000000-1111-`, `supabase/tests/shim.sql`'s own seeded vault key
# ids) appearing on the SAME line as the pseudonym_hmac name — a real
# secret has no reason to carry this exact fake UUID, so this only
# suppresses the specific rows it was written for.
# Line-scoped only, no `paths` entry — gitleaks 8.30 skips a
# path-allowlisted file entirely (verified: "scanned ~0 bytes"), which
# would hide a real secret anywhere in that file.
[[allowlists]]
description = "money-path test: the fixed fake Vault-key UUID (a0000000-1111-...) beside a pseudonym_hmac_vN name — not a real secret line"
regexTarget = "line"
regexes = ['''a0000000-1111-.*pseudonym_hmac_v[0-9]''']

# 2026-10-04 — mobile edge-contract fixture (apps/mobile/test/fixtures/edge-contract.json), the `markerscan_*` entries (P5.1a S2a). Each carries the
# request the REAL marker-scan handler was given, including a ROTATING COURSE-QR TOKEN: a compact JWS signed by one of the recorder's FIXED TEST Ed25519 keys (seed bytes
# 9 / 10 / 11 in apps/mobile/scripts/record-edge-contract.rec.ts; the PUBLIC half is all the server ever holds, and these private halves protect nothing). It is not a
# credential: it names the test kid "rk1", is single-use against a token row that exists only in the recorder's in-memory fake, and expired in 2026. The default `jwt` rule
# fires on its shape.
#
# Line-scoped and ANCHORED on the whole line, as the entry above: suppressed only when the line is, from first character to last, exactly a `"token": "<JWS>"` member whose
# header is the exact base64url of {"alg":"EdDSA","kid":"rk1","typ":"golfraven-course-qr+jwt"}, whose payload starts with the base64url of `{"exp":` and whose signature is exactly 86
# characters (a 64-byte Ed25519 signature). Any other JWT, any other kid, or anything appended to the line is NOT suppressed. No `paths` entry (gitleaks 8.30 would skip the
# whole file, see above).
[[allowlists]]
description = "mobile edge-contract fixture: a recorded course-QR rotating token signed by the recorder's fixed test key (kid rk1), the whole line — not a real credential"
regexTarget = "line"
regexes = ['''^\s*"token": "eyJhbGciOiJFZERTQSIsImtpZCI6InJrMSIsInR5cCI6ImdvbGZyYXZlbi1jb3Vyc2UtcXIrand0In0\.eyJleHAi[A-Za-z0-9_-]{40,300}\.[A-Za-z0-9_-]{86}",?\s*$''']

# 2026-10-03 — mobile edge-contract fixture (apps/mobile/test/fixtures/edge-contract.json). The
# recorder's SCRIPTED Play Integrity port (apps/mobile/scripts/record-edge-contract.rec.ts) accepts
# exactly "it-" + base64url(SHA-256 binding), 43 chars — a deterministic test value derived from the
# recorded binding, never a Google token (a real Play Integrity token is a JWE starting "eyJ"). The
# key name "integrityToken" plus the hash's entropy trips generic-api-key.
#
# Line-scoped and ANCHORED on the whole line (`^...$`, optional trailing comma): the finding is
# suppressed only when the line is, from its first character to its last, exactly such a JSON member.
# A real token appended to that line, or any longer line, is NOT suppressed. No `paths` entry, and no
# `condition = "AND"` with one: verified with gitleaks 8.30.1 that a `paths` entry makes it SKIP the
# matching file entirely even under AND ("scanned ~0 bytes"; a real token appended to the fixture line
# was then not reported), which would hide a real secret anywhere in that file. Residual: the same
# exact shape on a line of ANOTHER file is also suppressed (a real secret would have to be written as
# `"integrityToken": "it-<43 base64url characters>"` and nothing else on its line).
[[allowlists]]
description = "mobile edge-contract fixture: scripted Play Integrity test token 'it-' + 43-char base64url binding hash, the whole line — not a real token"
regexTarget = "line"
regexes = ['''^\s*"integrityToken": "it-[A-Za-z0-9_-]{43}",?\s*$''']
