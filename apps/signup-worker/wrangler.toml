# Cloudflare Worker config for the GolfRaven K2 signup backend.
#
# Nothing in this file is deployable as-is — every `TODO(owner)` below must
# be provisioned first. See README.md "Owner deploy runbook" for the full
# step-by-step. NO real account id, database id, KV id, or secret is
# committed here — secrets are set separately with `wrangler secret put`
# (never in this file).

name = "golfraven-signup-worker"
main = "src/index.ts"
compatibility_date = "2026-09-23"

# TODO(owner): your Cloudflare account id (`wrangler whoami`).
account_id = "TODO(owner)-cloudflare-account-id"

# Served same-origin under golfraven.<tld>/api/* so the landing page needs
# no CORS at all (task requirement). TODO(owner): replace with the real
# domain once it's registered (see docs/owner/accounts-and-domain-checklist.md).
[[routes]]
pattern = "golfraven.example/api/*"
zone_name = "golfraven.example"

# --- D1 ---------------------------------------------------------------
# Holds the `signups` table (migrations/0001_create_signups.sql). No IP
# address or user agent is ever written here — see that migration's header.
[[d1_databases]]
binding = "DB"
database_name = "golfraven-signups"
# TODO(owner): `wrangler d1 create golfraven-signups`, then paste the
# returned database_id here, then apply the migration:
#   wrangler d1 execute golfraven-signups --remote --file=./migrations/0001_create_signups.sql
database_id = "TODO(owner)-d1-database-id"

# --- KV -----------------------------------------------------------------
# Rate-limit counters ONLY (src/ratelimit.ts): a hashed IP key and a
# hashed email key, both TTL'd. No PII is ever stored here.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
# TODO(owner): `wrangler kv namespace create RATE_LIMIT_KV`, then paste
# the returned id here.
id = "TODO(owner)-kv-namespace-id"

# --- Cron -----------------------------------------------------------------
# Retention purge (gate finding F11) — see src/index.ts's `scheduled`
# handler and README.md "Data retention". Once daily is plenty for a purge
# with day-granularity cutoffs.
[triggers]
crons = ["0 9 * * *"]

# --- Non-secret vars ------------------------------------------------------
[vars]
# TODO(owner): must be an address on a Resend-verified sending domain
# (SPF/DKIM/DMARC configured — see README.md "Owner deploy runbook").
RESEND_FROM_EMAIL = "GolfRaven <hello@golfraven.example>"
# TODO(owner): the public origin, no trailing slash. Used to build the
# confirm/unsubscribe links in the confirmation email.
PUBLIC_BASE_URL = "https://golfraven.example"
# Optional CSV of origins allowed to call POST /api/signup cross-origin,
# for local dev ONLY (e.g. a `wrangler pages dev` origin on a different
# port). Leave empty in production — the Worker is same-origin there and
# needs no CORS headers at all.
ALLOWED_DEV_ORIGINS = ""
# Gate finding F6: global daily cap on confirmation emails actually sent
# (on top of the per-IP/per-email attempt caps). Raise/lower as needed.
GLOBAL_DAILY_SEND_CAP = "500"
# Gate finding F11/N2: the date/time K2's 6-week gate closes (day 0 + 42
# days) — see README.md "Data retention". Leave blank ("") until day 0 is
# logged in docs/p0/K2.md. MUST be a strict, full ISO-8601 UTC timestamp,
# exactly "YYYY-MM-DDTHH:MM:SSZ" (e.g. "2026-11-16T09:00:00Z") — a bare
# date, a bare year, or anything else is rejected outright by
# src/config.ts's checkK2GateClosesAt and never enables deletion. Even once
# set, the retention cron waits an ADDITIONAL 30 days past this timestamp
# before deleting any confirmed-then-unsubscribed row, so a K2 recount
# always stays possible through the verdict window (read at "≈ wk 7").
K2_GATE_CLOSES_AT = ""

# --- Secrets (set with `wrangler secret put <NAME>` — NEVER put values here) ---
# RESEND_API_KEY   — Resend API key, scoped to the sending domain above.
# TURNSTILE_SECRET — Cloudflare Turnstile secret key (paired with the site
#                    key configured in apps/landing/src/config.js).
# TOKEN_PEPPER     — random high-entropy string (e.g. `openssl rand -hex 32`),
#                    mixed into every stored token/IP hash. Rotating this
#                    invalidates every outstanding confirm/unsubscribe link
#                    and resets rate-limit history, so treat it as a
#                    long-lived secret once set.
